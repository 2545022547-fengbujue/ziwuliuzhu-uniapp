name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run algorithm, data and font checks
        run: npm test

      - name: Build H5, Android App and WeChat Mini Program
        run: npm run test:builds
